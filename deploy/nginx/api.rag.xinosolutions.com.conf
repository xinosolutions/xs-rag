# Install as /etc/nginx/sites-enabled/api.rag.xinosolutions.com.conf once DNS points here,
# then: nginx -t && systemctl reload nginx && certbot --nginx -d api.rag.xinosolutions.com
server {
    listen 80;
    server_name api.rag.xinosolutions.com;

    # Document uploads
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:1390;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (chat streaming, document events)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }
}
